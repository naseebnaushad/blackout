name: Windows Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtdeclarative'

      - name: Build Blackout with qmake & nmake
        shell: cmd
        run: |
          qmake blackout.pro "CONFIG+=release"
          nmake release

      - name: Deploy Qt Runtime with windeployqt
        shell: cmd
        run: |
          windeployqt --qmldir src --release release\blackout.exe

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\blackout
          Copy-Item -Path release\* -Destination dist\blackout -Recurse
          Copy-Item -Path README.md, LICENSE -Destination dist\blackout
          Compress-Archive -Path dist\blackout -DestinationPath blackout-windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackout-windows-x64
          path: blackout-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" blackout-windows-x64.zip --clobber
